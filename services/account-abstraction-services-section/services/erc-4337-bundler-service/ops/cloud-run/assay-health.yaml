steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        access_token="$(gcloud auth print-access-token)"
        token="$(curl --fail --silent --show-error -H "Authorization: Bearer ${access_token}" -H 'Content-Type: application/json' --data "{\"audience\":\"${_AUDIENCE}\",\"includeEmail\":true}" "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${_ASSAYER_SERVICE_ACCOUNT}:generateIdToken" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
        TOKEN="${token}" python3 - <<'PY'
        import base64, json, os, sys
        claims = os.environ["TOKEN"].split(".")[1]
        claims += "=" * (-len(claims) % 4)
        payload = json.loads(base64.urlsafe_b64decode(claims))
        print(json.dumps({key: payload.get(key) for key in ("iss", "sub", "email", "aud")}), file=sys.stderr)
        PY
        response="$(curl --fail --silent --show-error -H "Authorization: Bearer ${token}" "${_HEALTH_URL}/healthz")"
        test "${response}" = '{"status":"ready","executor":"kms-handle-ops","chainId":5615610,"entryPoint":"0x4337084d9e255ff0702461cf8895ce9e3b5ff108}'
        printf '%s\n' "${response}"
